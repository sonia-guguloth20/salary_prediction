<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Salary Prediction</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f0fdf4;
            border-radius: 10px;
            text-align: center;
        }

        #result h2 {
            color: #166534;
            margin-bottom: 10px;
        }

        #salary {
            font-size: 28px;
            font-weight: bold;
            color: #15803d;
        }

        #error {
            margin-top: 15px;
            color: red;
            text-align: center;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #555;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>💰 Salary Predictor</h1>

        <p class="subtitle">
            Linear Regression Machine Learning Model
        </p>


        <label for="experience">
            Years of Experience
        </label>

        <input
            type="number"
            id="experience"
            placeholder="Example: 5"
            min="0"
            step="0.1"
        >


        <button onclick="predictSalary()">
            Predict Salary
        </button>


        <div class="loading" id="loading">
            Predicting...
        </div>


        <div id="result">

            <h2>Predicted Salary</h2>

            <div id="salary">
                ₹0
            </div>

        </div>


        <div id="error"></div>

    </div>


    <script>

        async function predictSalary() {

            const experience =
                document.getElementById("experience").value;

            const result =
                document.getElementById("result");

            const salary =
                document.getElementById("salary");

            const error =
                document.getElementById("error");

            const loading =
                document.getElementById("loading");


            // Clear previous results

            result.style.display = "none";
            error.innerHTML = "";


            // Validate input

            if (experience === "") {

                error.innerHTML =
                    "Please enter years of experience.";

                return;
            }


            loading.style.display = "block";


            try {

                // Connect to FastAPI

                const response = await fetch(
                    "https://linear-regression-jlua.onrender.com",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            years_experience:
                                parseFloat(experience)
                        })
                    }
                );


                if (!response.ok) {

                    throw new Error(
                        "API request failed"
                    );

                }


                const data =
                    await response.json();


                // Display prediction

                salary.innerHTML =
                    "₹" +
                    data.predicted_salary.toLocaleString(
                        "en-IN"
                    );


                result.style.display = "block";


            } catch (err) {

                console.error(err);

                error.innerHTML =
                    "Unable to connect to FastAPI. Make sure the server is running.";

            }


            loading.style.display = "none";

        }

    </script>

</body>

</html>
